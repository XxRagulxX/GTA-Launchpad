name: Release

# Manual only - trigger from the Actions tab or:
#   gh workflow run release.yml -f version=v1.2.3
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag/version, e.g. v1.2.3"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish (.NET 10 win-x64 self-contained)
        # Force net10.0-windows so the csproj OS condition is bypassed on the
        # Windows runner (which would otherwise select net472).
        run: >
          dotnet publish Launchpad/Launchpad.csproj
          -c Release
          -r win-x64
          --self-contained true
          /p:TargetFramework=net10.0-windows
          /p:PublishSingleFile=true
          /p:EnableWindowsTargeting=true
          -o build/publish

      - name: Package
        run: Compress-Archive -Path build/publish/Launchpad.exe -DestinationPath "Launchpad-${{ inputs.version }}-win-x64.zip"
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: launchpad-win-x64
          path: Launchpad-${{ inputs.version }}-win-x64.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: artifacts/*
